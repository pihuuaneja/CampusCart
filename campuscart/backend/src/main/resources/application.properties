spring.application.name=campuscart
server.port=${PORT:8080}

# --- Database (override with environment variables) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campuscart}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Runs schema.sql and data.sql on startup (both are idempotent)
spring.sql.init.mode=always

# --- Security ---
# Secret must be at least 32 characters. Change it for any real deployment.
app.jwt.secret=${JWT_SECRET:campuscart-dev-secret-change-me-please-32chars}
app.jwt.expiry-hours=24
# Only emails of this domain (and its subdomains) can register.
app.email-domain=${EMAIL_DOMAIN:thapar.edu}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}

# --- Photo uploads ---
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
